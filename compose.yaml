name: decisao-investimento

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: 1000
        GID: 1000
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - invest_network
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - invest_network
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-decisao_investimento}
      POSTGRES_USER: ${DB_USERNAME:-invest_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret_invest_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-testing-db.sql:/docker-entrypoint-initdb.d/init-testing-db.sql:ro
    networks:
      - invest_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-invest_user} -d ${DB_DATABASE:-decisao_investimento}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: 1000
        GID: 1000
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3 --timeout=120
    volumes:
      - .:/var/www/html
    networks:
      - invest_network
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

volumes:
  postgres_data:
    driver: local

networks:
  invest_network:
    driver: bridge
